[project]
name = "download-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ahmed", email = "ahmedatefxbb@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=12.3.0",
    "pyqt6>=6.11.0",
    "pystray>=0.19.5",
    "requests>=2.34.2",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
download-manager = "download_manager:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
